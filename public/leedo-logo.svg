             C 715 720, 740 760, 770 730
             C 785 715, 765 675, 735 620
             C 700 550, 660 470, 610 390
             Z" stroke="none" />
             
    <path d="M 685 640
             C 660 680, 630 730, 655 770
             C 675 800, 720 780, 735 740
             C 750 700, 730 650, 700 635

             C 95 640, 50 690, 20 670
             C 2 655, 15 625, 30 610
             C 65 570, 110 500, 155 450
             C 170 435, 190 400, 205 365
             C 170 375, 120 390, 75 405
             C 30 420, 2 410, 0 385
             C -2 360, 25 350, 70 340
             C 125 325, 180 300, 220 270
             Z" stroke="none" />

